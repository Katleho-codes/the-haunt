# THE HAUNT on a homelab. Usage:
#
#   docker compose up -d --build                      # web app only (what the app needs today), http://<host>:3200
#   docker compose --profile backend up -d --build    # also start the hidden API placeholder (optional)
#   docker compose logs -f
#   docker compose down
#
# Change the published port with HAUNT_PORT (for example HAUNT_PORT=8080 docker compose up -d).
# Put a reverse proxy with HTTPS in front of the web service if it is reachable from outside your network.
# The app stores nothing on the server: each visitor's data stays in their own browser.
#
# Network layout (see apps/api/README.md):
#
#   browser --> [edge network] --> web ("the-haunt", the only published port)
#                                    |
#                                    +--> [backend network, internal: true] --> api (no published port, no internet)
#
# The api service is the only thing on the internal network besides web, so nothing outside Docker can reach it.
services:
  the-haunt:
    build: .
    image: the-haunt:local
    container_name: the-haunt
    restart: unless-stopped
    ports:
      - "${HAUNT_PORT:-3200}:3000"
    networks:
      - edge
      - backend
    environment:
      # Server-side only. Not NEXT_PUBLIC_*, so it is never sent to browsers. Nothing reads these yet.
      API_URL: http://api:4000
      API_TOKEN: ${API_TOKEN:-}
    # The app only serves files, so the container can be locked down.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    profiles: ["backend"]
    build: ./apps/api
    image: the-haunt-api:local
    container_name: the-haunt-api
    restart: unless-stopped
    # No `ports:` on purpose. `expose` only documents the port for other containers on the same network.
    expose:
      - "4000"
    networks:
      - backend
    environment:
      API_TOKEN: ${API_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # Normal network: published ports and internet access for the web container.
  edge: {}
  # Internal network: containers on it cannot reach the internet or the host, and nothing outside Docker can reach them.
  backend:
    internal: true
